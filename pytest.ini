[pytest]
base_url = https://sgs-cms-dev.qode.biz.id
addopts = --timeout=60 --reruns=1 --reruns-delay=10
markers =
    cms: test CMS SGS
    web: test website SGS
    smoke: health check cepat
    crud: membuat/mengubah/menghapus data CMS (auto-cleanup wajib di teardown)
    cross_check: verifikasi perubahan CMS tampil di web
